name: Deploy legal pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

      # İki sayfa da tek tek doğrulanıyor. Yalnız kökü kontrol etmek yetmez:
      # koşullar sayfası sessizce 404 verse de dağıtım yeşil görünürdü ve
      # mağazaya verilen bağlantı ölü olurdu.
      - name: Verify both pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          fetch() {
            curl --fail --location --silent --show-error \
              --retry 12 --retry-all-errors --retry-delay 5 "$1"
          }
          fetch "$PAGE_URL" | grep --fixed-strings 'Lunay Gizlilik Politikası'
          fetch "${PAGE_URL%/}/terms/" \
            | grep --fixed-strings 'Lunay Kullanım Koşulları'
